version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autocv-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autocv_password}
      POSTGRES_DB: ${POSTGRES_DB:-autocv_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocv_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
